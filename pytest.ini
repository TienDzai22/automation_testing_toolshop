[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: Fast checks that confirm the main application is available.
    regression: Broader checks for existing functionality.
    api: Tests that use Playwright APIRequestContext.
    bdd: Behaviour-driven tests implemented with pytest-bdd.
    buggy: Tests intentionally run against the buggy Toolshop environment.
log_cli = true
log_cli_level = INFO
